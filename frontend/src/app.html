<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
		<script>
			(function() {
				try {
					var saved = localStorage.getItem('nyaalist-theme') || 'auto';
					var isDark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					var root = document.documentElement;
					if (isDark) {
						root.classList.add('dark');
						root.classList.remove('light');
						root.setAttribute('data-theme', 'dark');
						root.style.colorScheme = 'dark';
					} else {
						root.classList.remove('dark');
						root.classList.add('light');
						root.setAttribute('data-theme', 'light');
						root.style.colorScheme = 'light';
					}
				} catch (_) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#F8FAFC] dark:bg-[#0A0E17] text-slate-800 dark:text-[#EDF2F7] font-sans antialiased selection:bg-[#00E5FF]/25 selection:text-[#00E5FF] min-h-screen relative overflow-x-clip transition-colors duration-300">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
