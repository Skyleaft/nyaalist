services:
  postgres:
    image: postgres:19-alpine
    container_name: nyaalist-db
    restart: unless-stopped
    profiles:
      - db
      - local-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyaalist}
      POSTGRES_USER: ${POSTGRES_USER:-nyaa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyaa_secure_password}
    volumes:
      - nyaalist-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyaa_user} -d ${POSTGRES_DB:-nyaalist}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nyaalist-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=5041
      - APP_ENV=production
      - DOWNLOADS_DIR=/data/downloads
      - LIBRARY_DIR=/data/library
      - COVERS_DIR=/data/covers
      - TEMP_ENCODE_DIR=/data/temp_encode
      - RUST_LOG=info,nyaalist=debug,tower_http=info
    volumes:
      - ./backend/data/downloads:/data/downloads
      - ./backend/data/library:/data/library
      - ./backend/data/covers:/data/covers
      - ./backend/data/temp_encode:/data/temp_encode
    ports:
      - "5041:5041"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nyaalist-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - ORIGIN=http://localhost:3040
      - PORT=3040
      - HOST=0.0.0.0
      - NODE_ENV=production
      - PUBLIC_API_URL=http://localhost:5041
      - PUBLIC_WS_URL=ws://localhost:5041/api/ws
    ports:
      - "3040:3040"

volumes:
  nyaalist-pgdata:
