[package]
name = "nyaalist-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework & async runtime
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database & Migrations
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-postgres"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
anyhow = "1.0"

# Configuration & Utilities
dotenvy = "0.15"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
walkdir = "2.5"

# Authentication & Security
argon2 = "0.5"
jsonwebtoken = "9.3"
axum-extra = { version = "0.9", features = ["cookie"] }

# HTTP Client, Scraping & Regex
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.20"
regex = "1.10"

# BitTorrent Downloader Engine
librqbit = "9.1"
